# https://taskfile.dev – `task` lists all commands, `task all PDF=input/xyz.pdf` does everything in one step.
version: "3"

vars:
  # Newest PDF in input/, can be overridden: task convert PDF=input/other.pdf
  PDF:
    sh: ls -t input/*.pdf | head -1
  PY: .venv/bin/python
  OUTDIR: output
  HOST: my-server
  REMOTE_DIR: /srv/web/data/waste
  BACKUP_ROOT: /srv/web
  URL: https://example.com/waste

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create the virtualenv and install dependencies
    status:
      - test -x .venv/bin/pytest
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -r requirements.txt

  test:
    desc: Run the tests
    deps: [setup]
    cmds:
      - .venv/bin/pytest -q

  convert:
    desc: Convert the PDF to JSON, CSV and ICS (PDF=input/xyz.pdf, default = newest PDF)
    deps: [setup]
    cmds:
      - "{{.PY}} waste_calendar.py {{.PDF}} --outdir {{.OUTDIR}} {{.CLI_ARGS}}"
    sources:
      - "{{.PDF}}"
      - waste_calendar.py
    generates:
      - "{{.OUTDIR}}/kaerjeng_waste.ics"

  convert:force:
    desc: Convert without the up-to-date check
    deps: [setup]
    cmds:
      - "{{.PY}} waste_calendar.py {{.PDF}} --outdir {{.OUTDIR}} {{.CLI_ARGS}}"

  deploy:
    desc: Upload the files to the Hetzner server and verify them online
    cmds:
      - task: upload
      - task: verify

  upload:
    desc: Upload only (old files are backed up on the server, mode 644)
    cmds:
      - >-
        rsync -av --exclude='*.notes.json'
        --backup --backup-dir={{.BACKUP_ROOT}}/backup-waste-$(date +%Y-%m-%d-%H%M%S)
        {{.OUTDIR}}/kaerjeng_waste*.ics {{.OUTDIR}}/kaerjeng_waste*.json {{.OUTDIR}}/kaerjeng_waste*.csv
        {{.HOST}}:{{.REMOTE_DIR}}/
      # macOS rsync has no --chmod; nginx needs readable files (otherwise 403)
      - ssh {{.HOST}} "chmod 644 {{.REMOTE_DIR}}/*"
    preconditions:
      - sh: test -f {{.OUTDIR}}/kaerjeng_waste.ics
        msg: "No output found - run `task convert` first."

  verify:
    desc: Check that the ICS is reachable online and identical to the local file
    cmds:
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' {{.URL}}/kaerjeng_waste.ics)
        [ "$code" = "200" ] || { echo "ERROR: HTTP $code"; exit 1; }
        curl -s {{.URL}}/kaerjeng_waste.ics | cmp - {{.OUTDIR}}/kaerjeng_waste.ics \
          && echo "OK: {{.URL}}/kaerjeng_waste.ics is identical to the local file"

  all:
    desc: Test, convert and deploy in one step
    cmds:
      - task: test
      - task: convert:force
      - task: deploy
