# https://taskfile.dev – `task` zeigt alle Befehle, `task all PDF=input/xyz.pdf` für alles in einem Schritt.
version: "3"

vars:
  # Neuestes PDF in input/, überschreibbar: task convert PDF=input/anderes.pdf
  PDF:
    sh: ls -t input/*.pdf | head -1
  PY: .venv/bin/python
  OUTDIR: output
  HOST: my-server
  REMOTE_DIR: /srv/web/data/waste
  BACKUP_ROOT: /srv/web
  URL: https://example.com/waste

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Virtualenv anlegen und Abhängigkeiten installieren
    status:
      - test -x .venv/bin/pytest
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -r requirements.txt

  test:
    desc: Tests ausführen
    deps: [setup]
    cmds:
      - .venv/bin/pytest -q

  convert:
    desc: PDF in JSON, CSV und ICS umwandeln (PDF=input/xyz.pdf, Default = neuestes PDF)
    deps: [setup]
    cmds:
      - "{{.PY}} waste_calendar.py {{.PDF}} --outdir {{.OUTDIR}} {{.CLI_ARGS}}"
    sources:
      - "{{.PDF}}"
      - waste_calendar.py
    generates:
      - "{{.OUTDIR}}/kaerjeng_waste.ics"

  convert:force:
    desc: Umwandeln ohne Aktualitätsprüfung
    deps: [setup]
    cmds:
      - "{{.PY}} waste_calendar.py {{.PDF}} --outdir {{.OUTDIR}} {{.CLI_ARGS}}"

  deploy:
    desc: Dateien auf den Hetzner-Server hochladen und online prüfen
    cmds:
      - task: upload
      - task: verify

  upload:
    desc: Nur hochladen (Backup der alten Dateien auf dem Server, Rechte 644)
    cmds:
      - >-
        rsync -av --exclude='*.notes.json'
        --backup --backup-dir={{.BACKUP_ROOT}}/backup-waste-$(date +%Y-%m-%d-%H%M%S)
        {{.OUTDIR}}/kaerjeng_waste*.ics {{.OUTDIR}}/kaerjeng_waste*.json {{.OUTDIR}}/kaerjeng_waste*.csv
        {{.HOST}}:{{.REMOTE_DIR}}/
      # macOS-rsync kennt kein --chmod; nginx braucht lesbare Dateien (sonst 403)
      - ssh {{.HOST}} "chmod 644 {{.REMOTE_DIR}}/*"
    preconditions:
      - sh: test -f {{.OUTDIR}}/kaerjeng_waste.ics
        msg: "Keine Outputs gefunden – zuerst `task convert` ausführen."

  verify:
    desc: Prüfen, dass die ICS online erreichbar und identisch mit der lokalen ist
    cmds:
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' {{.URL}}/kaerjeng_waste.ics)
        [ "$code" = "200" ] || { echo "FEHLER: HTTP $code"; exit 1; }
        curl -s {{.URL}}/kaerjeng_waste.ics | cmp - {{.OUTDIR}}/kaerjeng_waste.ics \
          && echo "OK: {{.URL}}/kaerjeng_waste.ics ist identisch mit der lokalen Datei"

  all:
    desc: Tests, Umwandeln und Deployen in einem Schritt
    cmds:
      - task: test
      - task: convert:force
      - task: deploy
